<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Blood drop (M - Massive Hemorrhage) -->
  <symbol id="icon-blood-drop" viewBox="0 0 24 24">
    <path d="M12 3 C7 10, 5 14, 5 17 a7 7 0 0 0 14 0 C19 14, 17 10, 12 3 Z" fill="#e04864" stroke="#c8102e" stroke-width="0.5"/>
    <path d="M10 15 C10 14, 11 13, 12 13" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.6" fill="none"/>
  </symbol>

  <!-- Head profile with nasal airway (A - Airway) -->
  <symbol id="icon-airway-head" viewBox="0 0 24 24" fill="none" stroke="#6fb2de" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 4 C11 3.2, 15 3.8, 17 6.5 C18.5 8.5, 18.2 11, 17.5 12.5 L17 14 L18 14.5 L17.5 16.5 L15.5 16.8 L15 19 L10 19 L10 16 C8 15.5, 6.5 13.5, 6.5 11 C6.5 8.5, 6.5 6, 7.5 4 Z"/>
    <path d="M17 14 C15 13, 14 11.5, 13.5 10 C13 8.5, 12 7, 10 7.5" stroke-dasharray="0.5 1"/>
    <circle cx="13.5" cy="9" r="0.5" fill="#6fb2de" stroke="none"/>
  </symbol>

  <!-- Lungs outlined (R - Respiration) -->
  <symbol id="icon-lungs" viewBox="0 0 24 24" fill="none" stroke="#7dbf91" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4 L12 9"/>
    <path d="M12 9 L9 11"/>
    <path d="M12 9 L15 11"/>
    <path d="M9 11 C6.5 11.5, 5 14, 5 17 C5 19, 6 20.5, 8 20 C10 19.5, 10.5 18, 10.5 15 L10.5 11.5"/>
    <path d="M15 11 C17.5 11.5, 19 14, 19 17 C19 19, 18 20.5, 16 20 C14 19.5, 13.5 18, 13.5 15 L13.5 11.5"/>
  </symbol>

  <!-- IV bag with heart (C - Circulation) -->
  <symbol id="icon-iv-bag-heart" viewBox="0 0 24 24" fill="none" stroke="#d88d3c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="2.5" x2="9" y2="2.5"/>
    <line x1="7.5" y1="2.5" x2="7.5" y2="4"/>
    <path d="M4.5 4 L10.5 4 L10.5 11 Q10.5 13, 9 13 L6 13 Q4.5 13, 4.5 11 Z"/>
    <line x1="7.5" y1="13" x2="7.5" y2="17"/>
    <circle cx="7.5" cy="18" r="0.6" fill="#d88d3c" stroke="none"/>
    <path d="M17 10 C17 8.5, 15.5 8, 14.8 9 C14.1 10, 14.1 11.5, 15 12.5 L17 14.5 L19 12.5 C19.9 11.5, 19.9 10, 19.2 9 C18.5 8, 17 8.5, 17 10 Z" fill="#e24b4a" stroke="#c8102e"/>
  </symbol>

  <!-- Thermometer (H - Hypothermia) -->
  <symbol id="icon-thermometer" viewBox="0 0 24 24" fill="none">
    <rect x="10.5" y="3" width="3" height="12" rx="1.5" stroke="#b39bd8" stroke-width="1"/>
    <circle cx="12" cy="17" r="3" fill="#8b6fb8" stroke="#6d539e" stroke-width="0.6"/>
    <rect x="11.25" y="8" width="1.5" height="8" fill="#8b6fb8"/>
    <line x1="14" y1="6" x2="15.5" y2="6" stroke="#b39bd8" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="14" y1="9" x2="15" y2="9" stroke="#b39bd8" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="14" y1="12" x2="15.5" y2="12" stroke="#b39bd8" stroke-width="0.8" stroke-linecap="round"/>
  </symbol>

  <!-- Plate (future: Armor / Body Armor) -->
  <symbol id="icon-plate" viewBox="0 0 24 24" fill="none" stroke="#d4a044" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 L18 5 L18 12 Q18 17, 12 21 Q6 17, 6 12 L6 5 Z"/>
    <path d="M9 10 L15 10 M9 13 L15 13" opacity="0.5"/>
  </symbol>

  <!-- Shield (future: Ballistic Shields) -->
  <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="#d4a044" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 L20 6 L20 13 Q20 18, 12 21 Q4 18, 4 13 L4 6 Z"/>
  </symbol>

  <!-- Helmet (future: Helmets) -->
  <symbol id="icon-helmet" viewBox="0 0 24 24" fill="none" stroke="#d4a044" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 15 Q4 8, 12 7 Q20 8, 20 15 L20 17 L4 17 Z"/>
    <line x1="4" y1="17" x2="20" y2="17"/>
    <path d="M8 11 L8 7.5 M16 11 L16 7.5" opacity="0.5"/>
  </symbol>

  <!-- Pouch (future: Nylon Gear / Pouches) -->
  <symbol id="icon-pouch" viewBox="0 0 24 24" fill="none" stroke="#d4a044" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="7" width="14" height="13" rx="1"/>
    <path d="M8 7 L8 4 L16 4 L16 7"/>
    <line x1="5" y1="11" x2="19" y2="11" opacity="0.5"/>
  </symbol>

  <!-- Flashlight (future: Lights) -->
  <symbol id="icon-flashlight" viewBox="0 0 24 24" fill="none" stroke="#d4a044" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10 L7 6 L15 14 L11 18 Z"/>
    <line x1="15" y1="14" x2="19" y2="10"/>
    <line x1="17" y1="12" x2="21" y2="8" opacity="0.5"/>
    <line x1="17" y1="16" x2="21" y2="12" opacity="0.5"/>
  </symbol>

  <!-- Knife (future: Tools & Knives) -->
  <symbol id="icon-knife" viewBox="0 0 24 24" fill="none" stroke="#d4a044" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 16 L15 4 L17 6 L5 18 Z"/>
    <rect x="15" y="16" width="6" height="3" rx="0.5" transform="rotate(-45 18 17.5)"/>
  </symbol>

  <!-- Optic / scope (future: Optics & Weapons) -->
  <symbol id="icon-optic" viewBox="0 0 24 24" fill="none" stroke="#d4a044" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="9" width="14" height="6" rx="1"/>
    <circle cx="11" cy="12" r="1.5"/>
    <line x1="18" y1="10" x2="21" y2="10"/>
    <line x1="18" y1="14" x2="21" y2="14"/>
    <line x1="11" y1="6" x2="11" y2="9" opacity="0.5"/>
  </symbol>

  <!-- Radio (future: Specialty / comms) -->
  <symbol id="icon-radio" viewBox="0 0 24 24" fill="none" stroke="#d4a044" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="5" width="10" height="16" rx="1.5"/>
    <line x1="9" y1="3" x2="9" y2="5"/>
    <circle cx="12" cy="17" r="1.5"/>
    <line x1="9" y1="9" x2="15" y2="9"/>
    <line x1="9" y1="12" x2="15" y2="12"/>
  </symbol>

</svg>
